name: Release Package

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (default: v<package.json version>)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-release:
    if: >-
      (github.event_name == 'push' &&
       github.actor != 'github-actions[bot]' &&
       !startsWith(github.event.head_commit.message, 'chore: refresh CRAP/coverage badges') &&
       !startsWith(github.event.head_commit.message, 'chore(release):')) ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build npm tarball and publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          tag_exists() {
            local t="$1"
            git rev-parse -q --verify "refs/tags/${t}" >/dev/null 2>&1 || gh release view "${t}" >/dev/null 2>&1
          }

          VERSION="$(node -p "require('./package.json').version")"
          TARGET_SHA="${GITHUB_SHA}"

          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="${INPUT_TAG}"
            VERSION="${TAG#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            TAG="v${VERSION}"
            if [ "${EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              if tag_exists "${TAG}"; then
                HIGHEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
                BASE_VERSION="${VERSION}"
                if [ -n "${HIGHEST_TAG}" ]; then
                  HIGHEST_VER="${HIGHEST_TAG#v}"
                  HIGHER="$(printf '%s\n%s\n' "${BASE_VERSION}" "${HIGHEST_VER}" | sort -V | tail -n 1)"
                  BASE_VERSION="${HIGHER}"
                fi
                if [ "${BASE_VERSION}" != "${VERSION}" ]; then
                  npm version "${BASE_VERSION}" --no-git-tag-version --allow-same-version
                fi
                while true; do
                  npm version patch --no-git-tag-version
                  NEW_VERSION="$(node -p "require('./package.json').version")"
                  NEW_TAG="v${NEW_VERSION}"
                  if ! tag_exists "${NEW_TAG}"; then
                    break
                  fi
                done
                VERSION="${NEW_VERSION}"
                TAG="${NEW_TAG}"

                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add package.json package-lock.json
                git commit -m "chore(release): ${TAG} [skip ci]"
                git pull --rebase origin main
                git push origin HEAD:main
                TARGET_SHA="$(git rev-parse HEAD)"
              fi
            fi
          fi

          CURRENT_PKG_VER="$(node -p "require('./package.json').version")"
          if [ "${CURRENT_PKG_VER}" != "${VERSION}" ]; then
            npm version "${VERSION}" --no-git-tag-version --allow-same-version
          fi

          TARBALL="$(npm pack --quiet)"
          cp "${TARBALL}" crap4js.tgz
          sha256sum "${TARBALL}" crap4js.tgz > SHA256SUMS

          if gh release view "${TAG}" >/dev/null 2>&1; then
            EXISTING_ASSETS="$(gh release view "${TAG}" --json assets --jq '.assets[].name' || true)"
            if printf '%s\n' "${EXISTING_ASSETS}" | grep -Fxq "${TARBALL}"; then
              echo "Release ${TAG} already contains immutable asset ${TARBALL}; skipping."
              exit 0
            fi
            echo "Uploading missing assets to release ${TAG} without overwriting..."
            gh release upload "${TAG}" "${TARBALL}" crap4js.tgz SHA256SUMS
          else
            echo "Creating immutable release ${TAG} and uploading ${TARBALL}..."
            gh release create "${TAG}" "${TARBALL}" crap4js.tgz SHA256SUMS \
              --target "${TARGET_SHA}" \
              --title "${TAG}" \
              --generate-notes
          fi
