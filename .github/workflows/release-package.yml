name: Release Package

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (default: v<package.json version>)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  package-release:
    if: github.actor != 'github-actions[bot]' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build npm tarball and publish GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="${INPUT_TAG}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi

          TARBALL="$(npm pack --quiet)"
          cp "${TARBALL}" crap4js.tgz
          sha256sum "${TARBALL}" crap4js.tgz > SHA256SUMS

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Updating assets on existing release ${TAG}..."
            gh release upload "${TAG}" "${TARBALL}" crap4js.tgz SHA256SUMS --clobber
          else
            echo "Creating release ${TAG} and uploading ${TARBALL}..."
            gh release create "${TAG}" "${TARBALL}" crap4js.tgz SHA256SUMS \
              --target "${GITHUB_SHA}" \
              --title "${TAG}" \
              --generate-notes
          fi
